<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Icons</title>
<style>
  body { margin: 0; background: #313338; font: 600 22px Manrope, Segoe UI, sans-serif; color: #dbdee1; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 48px; }
  .col { display: grid; justify-items: center; gap: 22px; }
  .big { width: 300px; height: 300px; border-radius: 50%; }
  .small { display: flex; align-items: center; gap: 14px; background: #2b2d31; padding: 12px 18px; border-radius: 10px; }
  .small img { width: 40px; height: 40px; border-radius: 50%; }
  .tiny img { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="row">
  <div class="col"><img class="big" src="icon-wheel.png"><div class="small"><img src="icon-wheel.png"><span>Колесо</span></div><div class="small tiny"><img src="icon-wheel.png"><span>20 px</span></div></div>
  <div class="col"><img class="big" src="icon-reel.png"><div class="small"><img src="icon-reel.png"><span>Бобина</span></div><div class="small tiny"><img src="icon-reel.png"><span>20 px</span></div></div>
  <div class="col"><img class="big" src="icon-halo.png"><div class="small"><img src="icon-halo.png"><span>Ореол</span></div><div class="small tiny"><img src="icon-halo.png"><span>20 px</span></div></div>
</div>
</body>
</html>
